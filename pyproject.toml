[project]
name = "pa-mcp"
version = "0.1.0"
description = "Personal Analyst MCP - Full-stack A-share quantitative trading MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "mx" }]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "akshare>=1.16.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "redis>=5.0.0",
    "croniter>=2.0.0",
    "structlog>=24.0.0",
]

# Optional: install TA-Lib C library first, then:
# pip install "pa-mcp[analysis]"
[project.optional-dependencies]
analysis = [
    "TA-Lib>=0.4.0",
    "pandas-ta>=0.3.14b",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
